<div class="post-list">
  <h2>Posts</h2>

  <div *ngFor="let post of posts" class="post-card">
    <div class="post-header">
      <h3 (click)="goToUserProfile(post.userId)">{{ getAuthorsUsername(post) }}</h3>
      <h3>{{ post.description }}</h3>
      <div class="post-actions">
        <!-- Dugmad za brisanje i izmenu su prebačena u ProfileComponent -->
      </div>

      <p class="post-location">Location: {{ post.latitude }}, {{ post.longitude }}</p>
    </div>

    <div class="post-image">
      <img *ngIf="post.imagePath; else noImage" [src]="imageBaseUrl + (post.compressedImagePath || post.imagePath)" alt="Post image" />
      <ng-template #noImage>
        <p>No image available</p>
      </ng-template>
    </div>

    <div class="post-footer">
      <p>Likes: {{ post.likesCount }}</p>
       <button
        *ngIf="isClient()"
        [disabled]="!hasSignedIn() " 
        class="like-button"
        (click)="toggleCommentInput(post.id)">
       {{ 'Comment 💬' }}
        
      </button>
      <button
        (click)="likePost(post.id)"
        *ngIf="isClient()"
        [disabled]="!hasSignedIn()" 
        class="like-button">
        {{ post.hasLiked ? 'Dislike' : 'Like ❤️' }}
      </button>
    </div>

      
    <div *ngIf="activeCommentPostId === post.id" class="comment-input-container">
      <textarea [(ngModel)]="commentInputs[post.id]" placeholder="Unesite komentar..." rows="3" class="comment-textarea"></textarea>
      <button class="comment-submit-btn" (click)="submitComment(post.id)">Done</button>
      <button class="comment-cancel-btn" (click)="activeCommentPostId = null">Close</button>
    </div>

    <div class="comments-toggle-section">
      <button class="comments-toggle-button" (click)="toggleComments(post)">
        <h4>Comments ({{ post.comments.length }}) {{ post.showComments ? '▲' : '▼' }}</h4>
      </button>
    </div>

    <div class="post-comments" *ngIf="post.showComments">
      <div *ngFor="let comment of post.comments" class="comment">
        <p><strong>User {{ comment.userId }}:</strong> {{ comment.content }}</p>
        <small>{{ comment.createdAt | date: 'short' }}</small>
      </div>
      
    </div>
  </div>
</div>
